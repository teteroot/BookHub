services:
  api-gateway:
    build:
      context: ./api-gateway
    ports:
      - "8888:8888"
    environment:
      SECURITY_JWT_KEY: ${SECURITY_JWT_KEY:?set SECURITY_JWT_KEY in .env}
      SECURITY_GATEWAY_SECRET: ${SECURITY_GATEWAY_SECRET:?set SECURITY_GATEWAY_SECRET in .env}
    depends_on:
      auth-service:
        condition: service_healthy
      profile-service:
        condition: service_healthy
      book-service:
        condition: service_healthy

  auth-service:
    build:
      context: ./auth-service
    ports:
      - "1812:1812"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-database:5432/${AUTH_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${AUTH_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${AUTH_DB_PASSWORD:?set AUTH_DB_PASSWORD in .env}

      SECURITY_JWT_LIFETIME: ${SECURITY_JWT_LIFETIME:-3600000}
      SECURITY_JWT_KEY: ${SECURITY_JWT_KEY:?set SECURITY_JWT_KEY in .env}
      SECURITY_REFRESH_LIFETIME: ${SECURITY_REFRESH_LIFETIME:-2592000000}
      SECURITY_ORIGIN_GATEWAY_SECRET: ${SECURITY_GATEWAY_SECRET:?set SECURITY_GATEWAY_SECRET in .env}
      SECURITY_ORIGIN_INTERNAL_SECRET: ${SECURITY_INTERNAL_SECRET:?set SECURITY_INTERNAL_SECRET in .env}

      SERVICES_PROFILE_SERVICE_URL: http://profile-service:8001
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --header=\"X-Gateway-Secret: $$SECURITY_ORIGIN_GATEWAY_SECRET\" --tries=1 --spider http://127.0.0.1:1812/actuator/health || exit 1" ]
      interval: 1s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      auth-database:
        condition: service_healthy

  profile-service:
    build:
      context: ./profile-service
    ports:
      - "8001:8001"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://profile-database:5432/${PROFILE_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${PROFILE_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${PROFILE_DB_PASSWORD:?set PROFILE_DB_PASSWORD in .env}
      SECURITY_ORIGIN_GATEWAY_SECRET: ${SECURITY_GATEWAY_SECRET:?set SECURITY_GATEWAY_SECRET in .env}
      SECURITY_ORIGIN_INTERNAL_SECRET: ${SECURITY_INTERNAL_SECRET:?set SECURITY_INTERNAL_SECRET in .env}
      SERVICES_BOOK_SERVICE_URL: http://book-service:8002
      SERVICES_AUTH_SERVICE_URL: http://auth-service:1812
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --header=\"X-Gateway-Secret: $$SECURITY_ORIGIN_GATEWAY_SECRET\" --tries=1 --spider http://127.0.0.1:8001/actuator/health || exit 1" ]
      interval: 1s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      profile-database:
        condition: service_healthy

  book-service:
    build:
      context: ./book-service
    ports:
      - "8002:8002"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://book-database:5432/${BOOK_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${BOOK_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${BOOK_DB_PASSWORD:?set BOOK_DB_PASSWORD in .env}
      SECURITY_ORIGIN_GATEWAY_SECRET: ${SECURITY_GATEWAY_SECRET:?set SECURITY_GATEWAY_SECRET in .env}
      SECURITY_ORIGIN_INTERNAL_SECRET: ${SECURITY_INTERNAL_SECRET:?set SECURITY_INTERNAL_SECRET in .env}
      SPRING_CLOUD_AWS_S3_ENDPOINT: http://book-s3-storage:9000
      SPRING_CLOUD_STORAGE_BUCKET_NAME: ${S3_BUCKET_NAME}
      SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY: ${MINIO_ROOT_USER}
      SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      SERVICES_PROFILE_SERVICE_URL: http://profile-service:8001
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --header=\"X-Gateway-Secret: $$SECURITY_ORIGIN_GATEWAY_SECRET\" --tries=1 --spider http://127.0.0.1:8002/actuator/health || exit 1" ]
      interval: 1s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      book-database:
        condition: service_healthy
      book-s3-storage:
        condition: service_healthy

  auth-database:
    image: postgres:18-alpine3.22
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?set AUTH_DB_PASSWORD in .env}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - auth_data:/var/lib/postgresql
    restart: unless-stopped

  profile-database:
    image: postgres:18-alpine3.22
    environment:
      POSTGRES_DB: ${PROFILE_DB_NAME}
      POSTGRES_USER: ${PROFILE_DB_USER}
      POSTGRES_PASSWORD: ${PROFILE_DB_PASSWORD:?set PROFILE_DB_PASSWORD in .env}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - profile_data:/var/lib/postgresql
    restart: unless-stopped

  book-database:
    image: postgres:18-alpine3.22
    environment:
      POSTGRES_DB: ${BOOK_DB_NAME}
      POSTGRES_USER: ${BOOK_DB_USER}
      POSTGRES_PASSWORD: ${BOOK_DB_PASSWORD:?set BOOK_DB_PASSWORD in .env}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - book_data:/var/lib/postgresql
    restart: unless-stopped

  book-s3-storage:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    user: root
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD-SHELL", "sh -c 'nc -z 127.0.0.1 9000' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - book_content:/data

volumes:
  auth_data:
  profile_data:
  book_data:
  book_content: