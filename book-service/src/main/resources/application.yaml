spring:
  application:
    name: book-service
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  cloud:
    aws:
      s3:
        path-style-access-enabled: true
        region: us-east-1
    storage:
      bucket-name: pdf-bucket
      content-type: application/pdf
      destination: books/%s
      page-destination: /pages
      file-extension: .pdf
      cover-destination: /cover
    cover:
      common-type: image/webp
      dpi: 150
      supported-types:
        - image/webp
        - image/png
        - image/jpeg
      target-ratio: '0.70710678' # ~ √2/2, base A4 format
      ratio-tolerance: 0.02
server:
  port: 8002
  forward-headers-strategy: framework
rest-client:
  timeout:
    connect-timeout: 3s
    read-timeout: 5s
resilience4j:
  circuitbreaker:
    instances:
      profileService:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - com.bookhub.bookservice.exceptions.extensions.RemoteInternalServerErrorException
        ignore-exceptions:
          - com.bookhub.bookservice.exceptions.extensions.RemoteServiceException
  retry:
    instances:
      profileService:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        exponential-max-wait-duration: 2s
        enable-randomized-wait: true
        randomized-wait-factor: 0.5
        retry-exceptions:
          - com.bookhub.bookservice.exceptions.extensions.RemoteInternalServerErrorException
        ignore-exceptions:
          - com.bookhub.bookservice.exceptions.extensions.RemoteServiceException
springdoc:
  api-docs:
    path: /book/v3/api-docs
  swagger-ui:
    enabled: false
  show-login-endpoint: true
  model-and-view-allowed: true
